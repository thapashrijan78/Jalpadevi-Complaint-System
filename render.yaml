services:
  - type: web
    name: jalpadevi-complaint-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    disk:
      name: complaint-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STORAGE_DIR
        value: /var/data
      - key: ADMIN_EMAILS
        value: hemrajpanditjee@gmail.com,karkipadam948@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
