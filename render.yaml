services:
  - type: web
    name: jalpadevi-complaint-system
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: complaint-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STORAGE_DIR
        value: /var/data
      - key: ADMIN_EMAILS
        value: hemrajpanditjee@gmail.com,karkipadam948@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
